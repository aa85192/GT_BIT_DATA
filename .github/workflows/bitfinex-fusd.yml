name: Fetch Bitfinex fUSD market data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitfinex-fusd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fUSD trades/candles/stats
        env:
          BITFINEX_SYMBOL: fUSD
          BITFINEX_CANDLE: "trade:1m:fUSD:a30:p2:p30"
          BITFINEX_CANDLE_FALLBACK: "trade:1m:fUSD:p30"
          LOOKBACK_MIN: "30"
          BITFINEX_LIMIT: "1000"
          HTTP_TIMEOUT_SEC: "20"
        run: python scripts/fetch_bitfinex_fusd.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data meta
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bitfinex fUSD update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
